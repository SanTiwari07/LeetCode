name: Sync LeetCode

on:
  schedule:
    # Every 4 hours. LeetCode's public API only shows the last 20 accepted
    # problems, so keep this frequent when running without secrets.
    - cron: "23 */4 * * *"
  workflow_dispatch:
  # The browser extension updates data/solved.json; re-render the README table.
  push:
    paths:
      - data/solved.json

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync solved problems
        env:
          LEETCODE_USERNAME: cmy7RSNHvA
          # Optional: add these repository secrets to also sync your code.
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_msg
        run: python scripts/sync_leetcode.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -F "$RUNNER_TEMP/commit_msg"
          # The extension may have pushed while this job ran.
          git pull --rebase
          git push
