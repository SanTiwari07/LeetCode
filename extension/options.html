<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LeetCode → GitHub Sync settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <h1>LeetCode → GitHub Sync</h1>
  <p class="muted">Every accepted submission is pushed to this repository.</p>

  <label>GitHub username or org
    <input id="owner" placeholder="SanTiwari07" autocomplete="off">
  </label>
  <label>Repository
    <input id="repo" placeholder="LeetCode" autocomplete="off">
  </label>
  <label>Branch <span class="muted">(blank = the repo's default branch)</span>
    <input id="branch" placeholder="main" autocomplete="off">
  </label>
  <label>GitHub token
    <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
  </label>
  <p class="muted small">
    Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">fine-grained token</a>:
    <b>Repository access</b> → only this repository, <b>Permissions</b> → Contents: <b>Read and write</b>.
    The token is stored only in this browser.
  </p>

  <div class="row">
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
  </div>
  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
