<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header>
    <strong>LeetCode Sync</strong>
    <a href="#" id="settings">Settings</a>
  </header>
  <p id="target" class="muted small"></p>
  <div class="row">
    <button id="sync" title="Save anything new since the last sync">Sync now</button>
    <button id="import" class="secondary" title="Re-read your whole LeetCode history">Import full history</button>
  </div>
  <p id="sync-status" class="small"></p>
  <h2>Recent</h2>
  <ul id="history"></ul>
  <script src="popup.js"></script>
</body>
</html>
